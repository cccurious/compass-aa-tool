<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>#AAメーカー | #コンパス チャットのドット絵・AA作成ツール</title>
    <meta name="description" content="#コンパス のゲーム内チャットで崩れないドット絵・アスキーアート（AA）を作るツール。マス目に置くだけ、または既存のAAを貼り付けるだけで、実機と同じ形に見えるよう自動調整したテキストを作れます。">

    <!-- アイコンは他ツールと統一（同じ作者のツールと分かるように） -->
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <!-- GA4。BM チェッカーとは別プロパティで管理する。
         G-XXXXXXXXXX を自分の測定 ID に置き換えると計測が始まる（docs/notes/ga4-setup.md）。
         SPA なのでビュー切替は src/utils/analytics.ts から手動で page_view を送る。 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
